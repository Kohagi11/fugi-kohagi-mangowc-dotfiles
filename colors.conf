# ~/.config/wallust/templates/mango-colors.conf
# Template pywal do wallust. Gera ~/.config/mango/colors.conf
# a cada wallpaper novo. Edite ESTE arquivo, nunca o gerado.
#
# Se algum slot sair com uma cor que não combina com o resto,
# é só trocar o número (color0-color15, background, foreground).

rootcolor=0x0B0A0Aff
bordercolor=0x222121ff
focuscolor=0x960B06ff
maximizescreencolor=0x750907ff
urgentcolor=0x280908ff
scratchpadcolor=0x4E4C4Cff
globalcolor=0x3E0707ff
overlaycolor=0x960B06ff
dropcolor=0x960B0600

